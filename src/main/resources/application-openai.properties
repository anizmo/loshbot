spring.ai.openai.api-key=${OPENAI_API_KEY:your-api-key-here}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.4
spring.ai.openai.embedding.model=text-embedding-3-small
# Use below to connect to any OpenAI-compatible API (e.g. Groq, DeepSeek, Together, LM Studio)
# spring.ai.openai.base-url=http://localhost:1234/v1

# Exclude Ollama autoconfig when OpenAI is active
spring.autoconfigure.exclude=\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
